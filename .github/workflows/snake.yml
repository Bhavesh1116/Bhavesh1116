name: Generate Snake

on:
  # Har roz raat ko 12 baje run hoga
  schedule:
    - cron: "0 0 * * *"
  # Manually bhi run kar sako
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          # Tumhara GitHub user name
          github_user_name: Bhavesh1116
          # Output files (light aur dark mode ke liye)
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to the output branch
        uses: crazy-max/gh-action-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
