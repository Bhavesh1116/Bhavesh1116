name: Generate Pacman Graph

on:
  # Har 24 ghante mein automatically run hoga
  schedule:
    - cron: "0 0 * * *" 
  # Manually run karne ke liye option
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-pacman-graph
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Pacman Graph
        uses: k-phy/pacman-contribution-graph@v2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          username: Bhavesh1116
          # Output files dist folder mein generate honge
          build_dir: dist

      - name: Push to Output Branch
        uses: crazy-max/gh-action-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
