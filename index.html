<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bhavesh — Hacker UI</title>
  <link rel="stylesheet" href="assets/style.css" />
  <meta name="description" content="Config files for my GitHub profile. Hacker UI by Bhavesh1116" />
</head>
<body>
  <div id="matrix"></div>

  <main class="terminal" role="main" aria-label="Hacker terminal">
    <div class="terminal-header">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <div class="title">Bhavesh1116 — Hacker UI</div>
    </div>

    <div class="terminal-body" id="terminal-body">
      <div class="line">Welcome to <span class="accent">Bhavesh</span>'s terminal. Type <span class="hint">help</span> or click the commands below.</div>
      <div id="output" class="output"></div>

      <div class="controls">
        <button data-cmd="whoami">whoami</button>
        <button data-cmd="about">about</button>
        <button data-cmd="projects">projects</button>
        <button data-cmd="open-site">open site</button>
      </div>

      <div class="prompt"><span class="user">guest@bhavesh</span>:~$ <span id="input" class="typed"></span><span class="cursor">█</span></div>
    </div>

    <footer class="terminal-footer">
      <a href="https://github.com/Bhavesh1116" target="_blank" rel="noopener">GitHub</a> •
      <a href="https://github.com/Bhavesh1116/Bhavesh1116" target="_blank" rel="noopener">Repo</a>
    </footer>
  </main>

  <script src="assets/script.js"></script>
</body>
</html>
